<head>
    <base href="/wxs-release/">
    <!-- РОУТЕР: адрес вида /wxs-release/<режим>. Без известного режима страница пустая и ничего не грузит. -->
    <script>
    (function () {
        var KNOWN = { crash: true };   // сюда добавлять новые режимы: mines, upgrader ...
        var BOTS = { crash: '@wxscrash_bot' };   // бот каждого режима (для текста «откройте через бота»)
        var route = location.pathname.replace(/^\/wxs-release/i, '').replace(/^\/+|\/+$/g, '').toLowerCase();
        if (!route) { try { route = (new URLSearchParams(location.search).get('app') || '').toLowerCase(); } catch (e) {} }
        // Mini App открыт ссылкой t.me/<бот>?startapp=<режим>: Telegram кладёт параметр в hash (tgWebAppStartParam)
        if (!route || !Object.prototype.hasOwnProperty.call(KNOWN, route)) {
            try { route = (new URLSearchParams(location.hash.replace(/^#/, '')).get('tgWebAppStartParam') || route || '').toLowerCase(); } catch (e) {}
        }
        window.WXS_ROUTE = Object.prototype.hasOwnProperty.call(KNOWN, route) ? route : '';
        if (!window.WXS_ROUTE) {
            try { window.stop(); } catch (e) {}
            document.documentElement.innerHTML = '<head><meta charset="UTF-8"><meta name="robots" content="noindex"><title></title></head><body style="margin:0;background:#090909"></body>';
            return;
        }
        window.WXS_BOT = BOTS[window.WXS_ROUTE] || '';
        document.documentElement.setAttribute('data-route', window.WXS_ROUTE);
    })();
    </script>

    <style>
        .crash-countdown {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', 'Arial Black', sans-serif;
            font-weight: 900;
            font-size: 130px;
            line-height: 1;
            background-size: 250% 250%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            pointer-events: none;
            user-select: none;
            z-index: 6;
            will-change: transform;
            animation: crashCountdownPulse 0.9s ease-in-out infinite;
        }
        .crash-countdown.cc-green {
            background-image: linear-gradient(120deg, #0aff6e, #baffd8, #0aff6e, #05a648, #0aff6e);
            filter: drop-shadow(0 0 16px #0aff6e) drop-shadow(0 0 44px rgba(10,255,110,0.6));
        }
        .crash-countdown.cc-yellow {
            background-image: linear-gradient(120deg, #fff200, #fffabf, #fff200, #c9a600, #fff200);
            filter: drop-shadow(0 0 16px #fff200) drop-shadow(0 0 44px rgba(255,242,0,0.6));
        }
        .crash-countdown.cc-red {
            background-image: linear-gradient(120deg, #ff2b2b, #ffb3b3, #ff2b2b, #a10000, #ff2b2b);
            filter: drop-shadow(0 0 16px #ff2b2b) drop-shadow(0 0 44px rgba(255,43,43,0.6));
        }
        @keyframes crashCountdownShimmer {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes crashCountdownPulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.1); }
        }

        /* Свечение следа — полупрозрачные слои вместо filter: drop-shadow
           (drop-shadow пересчитывался на каждом кадре и фризил телефон).
           Точка двигается через transform, а не cx/cy — это бесплатно для GPU. */
        /* Свечение — НЕпрозрачные формы внутри группы с общей прозрачностью:
           линия и кружок на конце сливаются в один цвет без тёмного наложения.
           Размеры точки = размерам шлейфа: сердцевина 22px, свечение 46px. */
        #crashTrailGlowGroup { opacity: 0.28; }
        #crashTrailGlow, #crashTrailLine, #crashTrailDot, #crashTrailDotGlow { transition: opacity 0.9s ease; }
        #crashTrailDot { transform-box: fill-box; transform-origin: center; }
        @keyframes crashDotPulse {
            0%, 100% { transform: scale(1);    fill-opacity: 1; }
            50%      { transform: scale(0.62); fill-opacity: 0.65; }
        }
        #crashTrailDot.crash-dot-live { animation: crashDotPulse 1s ease-in-out infinite; }
        #crashTrailLine.crash-trail-crashed,
        #crashTrailGlow.crash-trail-crashed { stroke: #ff3b3b; }
        #crashTrailDot.crash-trail-crashed { fill: #ffdada; animation: none; }
        #crashTrailDotGlow.crash-trail-crashed { fill: #ff3b3b; }
        #crashTrail { contain: layout paint; }
        /* ---- Верхняя панель краша: банк / номер игры / старт через ---- */
        .crash-topbar { margin-bottom: 0; }
        .crash-topbar .ice-arena-info-box strong {
            display: block; font-size: 17px; line-height: 24px; min-height: 24px;
            font-variant-numeric: tabular-nums;
        }
        .crash-timer-box strong { font-size: 22px; transition: color 0.2s ease; }
        .crash-timer-box strong.tb-green  { color: #3dff9a; text-shadow: 0 0 12px rgba(61,255,154,0.75); }
        .crash-timer-box strong.tb-yellow { color: #ffd21f; text-shadow: 0 0 12px rgba(255,210,31,0.75); }
        .crash-timer-box strong.tb-red    { color: #ff4d4d; text-shadow: 0 0 12px rgba(255,77,77,0.8); }
        .crash-timer-box strong.tb-pop    { animation: crashTbPop 0.35s ease-out; }
        @keyframes crashTbPop {
            0%   { transform: scale(1.45); }
            100% { transform: scale(1); }
        }

        .crash-mult-topleft {
            position: absolute;
            top: 14px;
            left: 18px;
            font-family: 'Orbitron', 'Arial Black', sans-serif;
            font-weight: 900;
            font-size: 38px;
            line-height: 1;
            letter-spacing: 0.5px;
            color: #3dff9a;
            text-shadow: 0 0 14px rgba(61,255,154,0.85);
            z-index: 7;
            display: none;
            pointer-events: none;
            transition: color 0.15s ease;
        }
        .crash-mult-topleft.crashed {
            color: #ff4d4d;
            text-shadow: 0 0 14px rgba(255,77,77,0.85);
        }
    </style>
</head>

<!-- ================================================================
     ДОСТУП ТОЛЬКО ЧЕРЕЗ TELEGRAM. Экран блокировки виден по умолчанию и
     скрывается, только если страницу открыл настоящий Telegram WebApp.
     Если script.js не загрузился — экран так и остаётся (закрыто по умолчанию).
================================================================== -->
<div id="tgBlockScreen" class="tg-block-screen">
    <div class="tg-block-inner">
        <div class="tg-block-icon">✈️</div>
        <div class="tg-block-title">Доступ только через Telegram</div>
        <p class="tg-block-text">Это приложение работает только внутри Telegram. Откройте его через бота <span id="tgBlockBot">@wxscrash_bot</span>.</p>
    </div>
</div>
<script>
(function () {
    var botEl = document.getElementById('tgBlockBot');
    if (botEl && window.WXS_BOT) botEl.textContent = window.WXS_BOT;
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg && typeof tg.initData === 'string' && tg.initData.length > 0 && tg.platform && tg.platform !== 'unknown') {
        document.documentElement.classList.add('tg-ok');
    }
})();
</script>

                <span class="app-loader-moon-crater app-loader-moon-crater-b"></span>
                <span class="app-loader-moon-crater app-loader-moon-crater-c"></span>
                <span class="app-loader-moon-crater app-loader-moon-crater-d"></span>
                <span class="app-loader-moon-crater app-loader-moon-crater-e"></span>
                <span class="app-loader-moon-crater app-loader-moon-crater-f"></span>
                <span class="app-loader-moon-text">WXS</span>
            </div>
        </div>

        <div class="app-loader-title"><span class="w">WXS</span> <span class="g">GAME</span></div>
        <div class="app-loader-subtitle">Загрузка...</div>

        <div class="app-loader-progress-track">
            <div class="app-loader-progress-fill" id="appLoaderProgressFill"></div>
        </div>
    </div>
</div>

<div class="app">

    <header class="top">
        <div class="profile-card">
            <div class="avatar-frame">
                <div class="avatar" id="avatar">👤</div>
            </div>
            <div class="profile-info">
                <div class="username" id="username">Игрок</div>
            </div>
        </div>
        <div class="balance">
            <div class="balance-info">
                <small>Баланс</small>
                <span id="topBalance">0.00 $</span>
            </div>
        </div>
    </header>

    <!-- ==================== КРАШ ==================== -->
    <main id="crashPage" class="crash-page">
        <section class="wheel-card">

            <div class="ice-arena-topbar crash-topbar">
                <div class="ice-arena-info-box">
                    <small>БАНК</small>
                    <strong id="crashBankValue">0.00 $</strong>
                </div>
                <div class="ice-arena-info-box">
                    <small>ИГРА</small>
                    <strong id="crashGameNumber">—</strong>
                </div>
                <div class="ice-arena-info-box crash-timer-box" id="crashTimerBox">
                    <small>СТАРТ ЧЕРЕЗ</small>
                    <strong id="crashTimerValue">—</strong>
                </div>
            </div>

            <div id="crashStage" style="position: relative; height: 340px; margin: 16px 0; border-radius: 16px; background: linear-gradient(180deg, #10131a 0%, #05060a 100%); border: 1px solid rgba(255,255,255,0.08); overflow: hidden;">
                <svg id="crashTrail" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;">
                    <g id="crashTrailGlowGroup">
                        <path id="crashTrailGlow" d="" fill="none" stroke="#3dff9a" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle id="crashTrailDotGlow" cx="0" cy="0" r="23" fill="#3dff9a" transform="translate(-100,-100)" style="opacity:0;"/>
                    </g>
                    <path id="crashTrailLine" d="" fill="none" stroke="#3dff9a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
                    <g id="crashTrailHead" transform="translate(-100,-100)">
                        <circle id="crashTrailDot" cx="0" cy="0" r="11" fill="#eafff2" style="opacity:0;"/>
                    </g>
                </svg>
                <div id="crashRocket" style="position:absolute; left:16px; bottom:16px; width:200px; height:200px; will-change: transform;"></div>
                <div id="crashExplosion" style="position:absolute; left:16px; bottom:16px; width:200px; height:200px; text-align:center; display:none; will-change: transform, opacity; transition: opacity 0.3s ease;"></div>
                <div id="crashCenterInfo" style="position:absolute; top:50%; left:50%; transform: translate(-50%,-50%); text-align:center; width: 100%;">
                    <strong id="crashMultiplier" style="display:block; font-size: 34px; font-weight: 900; color:#fff;">1.00x</strong>
                    <div id="crashStatus" style="font-size: 12px; color:#888; font-weight:800; margin-top:4px;">Загрузка...</div>
                </div>
                <div id="crashMultTopLeft" class="crash-mult-topleft">1.00x</div>
                <div id="crashCountdown" class="crash-countdown"></div>

                <!-- Круглая кнопка с "#" внизу справа на экране игры Crash -->
                <button id="crashFairnessBtn" class="crash-fairness-trigger" title="Доказуемая честность" onclick="openCrashFairnessModal()">
                    <span>#</span>
                </button>
            </div>

            <div id="crashHistoryList" class="crash-history-scroll"></div>

            <div class="crash-players-box">
                <div class="crash-players-header">
                    <span>Игроки в раунде</span>
                    <span id="crashPlayersCount" class="crash-players-count">0</span>
                </div>
                <div id="crashPlayersList" class="crash-players-list"></div>
            </div>

            <div class="ctrl-box">
                <div class="mines-bet-header">
                    <label id="crashBetLabel">СУММА СТАВКИ</label>
                    <div class="card-input-wrap">
                        <input type="number" id="crashBetInput" placeholder="0.10" min="0.1" step="any" inputmode="decimal" onblur="clampBetInputOnBlur(event)" onkeydown="blockInvalidBetKeys(event)">
                        <span class="currency-symbol">$</span>
                    </div>
                </div>
                <div class="ctrl-btns-row" style="margin-top: 10px;">
                    <button class="pct-btn" onclick="adjustCrashBet(0.5)">½</button>
                    <button class="pct-btn" onclick="adjustCrashBet(2)">x2</button>
                    <button class="pct-btn" onclick="setCrashMaxBet()">MAX</button>
                </div>
                <button type="button" class="crash-fb-btn hidden" id="crashFreebetBtn" onclick="toggleCrashFreebet()">
                    <span>🎁</span>
                    <span id="crashFreebetText">Фрибет</span>
                </button>
            </div>

            <button class="mines-main-btn" id="crashActionBtn" onclick="handleCrashAction()" style="margin-top: 14px; width: 100%;">
                Сделать ставку
            </button>
        </section>
    </main>

<!-- МОДАЛЬНОЕ ОКНО "ДОКАЗУЕМАЯ ЧЕСТНОСТЬ" -->
<!-- Закругленное всплывающее меню (Bottom Sheet) -->
<div id="crashFairnessModal" class="crash-fairness-modal hidden">
    <div class="crash-fairness-backdrop" id="crashFairnessBackdrop" onclick="closeCrashFairnessModal()"></div>
    <div class="crash-fairness-content" id="crashFairnessContent">
        <div class="crash-fairness-drag-handle-area" id="crashFairnessDragHandle">
            <div class="crash-fairness-drag-handle"></div>
        </div>
        <div class="crash-fairness-header">
            <h3>Доказуемая честность</h3>
        </div>

        <div class="crash-fairness-body">
            <div class="fairness-field-group">
                <label><img src="images/ui/lock.png" class="fairness-label-icon" alt="" draggable="false"> Хеш раунда</label>
                <div class="fairness-input-box">
                    <input type="text" id="crashRoundHashInput" readonly placeholder="Генерация..." />
                    <button id="copyCrashHashBtn" class="copy-btn" onclick="copyCrashHash()"><img src="images/ui/copy.png" class="copy-btn-icon" alt="Копировать" draggable="false"></button>
                </div>
            </div>

            <div class="fairness-field-group">
                <label><img src="images/ui/key.png" class="fairness-label-icon" alt="" draggable="false"> SHA-256 Ключ</label>
                <div class="fairness-input-box">
                    <input type="text" id="crashRoundKeyInput" readonly placeholder="Раскроется сервером после раунда" />
                    <button id="copyCrashKeyBtn" class="copy-btn" onclick="copyCrashKey()"><img src="images/ui/copy.png" class="copy-btn-icon" alt="Копировать" draggable="false"></button>
                </div>
            </div>

            <a href="https://emn178.github.io/online-tools/sha256.html" target="_blank" rel="noopener" class="fairness-verify-link">
                Проверить честность ↗
            </a>
        </div>
    </div>
</div>

</div>
