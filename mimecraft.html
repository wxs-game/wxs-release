 for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]])if(rnd()<.75)px(i,cx+dx,cy+dy,rnd()<.35?c2:c1)}};

 t=[0,1,2].map(i=>st[i]>0?(c[i]+1-[o.x,o.y,o.z][i])*dl[i]:st[i]<0?([o.x,o.y,o.z][i]-c[i])*dl[i]:1e9);

const parts=[];
const coinC=document.createElement('canvas');coinC.width=coinC.height=32;{const g=coinC.getContext('2d');g.fillStyle='#8a6a00';g.beginPath();g.arc(16,16,15,0,7);g.fill();
 g.fillStyle='#ffd23a';g.beginPath();g.arc(16,16,12.5,0,7);g.fill();g.fillStyle='#b38600';g.font='bold 18px monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('$',16,17)}
const coinT=new THREE.CanvasTexture(coinC);
function burst(x,c,z,col,n,coin){for(let i=0;i<n;i++){let o;
  if(coin){o=new THREE.Sprite(new THREE.SpriteMaterial({map:coinT,transparent:true}));o.scale.set(.28,.28,1)}
  else{o=new THREE.Mesh(new THREE.BoxGeometry(.11,.11,.11),new THREE.MeshBasicMaterial({color:col}))}
  o.position.set(x+.5,c+.5,z+.5);scene.add(o);
  parts.push({o,vx:(Math.random()-.5)*(coin?3.5:4),vy:(coin?4:1.5)+Math.random()*(coin?4:3),vz:(Math.random()-.5)*(coin?3.5:4),t:coin?1.7:.8,coin})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t-=dt;q.vy-=(q.coin?14:20)*dt;
  q.o.position.x+=q.vx*dt;q.o.position.y+=q.vy*dt;q.o.position.z+=q.vz*dt;if(q.coin)q.o.material.opacity=Math.min(1,q.t*2);else q.o.rotation.x+=dt*8;
  if(q.t<=0){scene.remove(q.o);q.o.material.dispose();q.o.geometry?.dispose();parts.splice(i,1)}}}
const popEl=document.getElementById('pop');let popT=0;

   dead=true;document.getElementById('dead').style.display='flex';setTimeout(respawn,2600)}},110)}

const colorOf=id=>ORES[id]?ORES[id][2]:id===GRASS?'#5f9f45':id===DIRT?'#866043':id===STONE?'#7d7d7d':'#464646';
async function breakBlock(t){const ore=ORES[t.id];
 if(!ore){dropBlock(t.x,t.c,t.z);rebuild();burst(t.x,t.c,t.z,colorOf(t.id),10);vib('light');prog=0;return}
 if(API.bal+1e-9<ore[1]){pop('Недостаточно средств',`Нужно $${ore[1].toFixed(2)} · баланс $${API.bal.toFixed(2)}`,'err');cool=.8;prog=0;shake=.15;vib('light');return}
 busy=true;let r;try{r=await API.dig(ore[0])}catch(e){busy=false;prog=0;cool=.8;const m=String(e.message);
  if(/NO_FUNDS/.test(m)){API.init().then(upd).catch(()=>{});pop('Недостаточно средств','Пополните баланс','err')}

const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.004,1.004,1.004)),new THREE.LineBasicMaterial({color:0x000000}));edge.visible=false;scene.add(edge);
