<html lang="ru"><head><meta charset="utf-8">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#78a7ff;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Courier New",monospace}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#L,#R{position:fixed;top:0;bottom:0;width:50%}#L{left:0}#R{right:0}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#hud{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);image-rendering:pixelated;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#dead{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(120,0,0,.55);color:#fff;z-index:10;text-align:center}
#dead h1{font-size:34px;margin:0 0 6px;text-shadow:3px 3px #3f3f3f}#dead button{margin-top:18px;padding:12px 26px;font:bold 16px monospace;background:#8b8b8b;color:#fff;border:3px solid #fff;border-radius:0;box-shadow:inset -3px -3px #555,inset 3px 3px #bbb}
.btn{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);display:none;align-items:center;justify-content:center;color:#fff;font-size:30px;touch-action:none}
#dig{right:26px;bottom:110px;width:84px;height:84px}#jump{right:128px;bottom:76px;width:62px;height:62px}
#stick{position:fixed;width:110px;height:110px;margin:-55px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}

#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 8px) 12px 8px;z-index:5;pointer-events:none;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.profile-card{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 10px 4px 4px;border-radius:24px;background:rgba(12,12,14,.72);border:1px solid rgba(255,255,255,.1)}
.avatar-frame{width:48px;height:48px;flex-shrink:0;padding:2px;border-radius:50%;background:linear-gradient(135deg,#ffd60a,#ff9a0a,#ff5500);box-shadow:0 0 14px rgba(255,150,0,.35);box-sizing:border-box}
.avatar{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 35% 25%,#333,#121212 70%);border:2px solid #090909;box-sizing:border-box;font-size:22px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}
.profile-info{min-width:0;width:100px}
.username{max-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;font-weight:800;color:#fff;letter-spacing:-.2px;font-style:italic}
.balance{display:flex;align-items:center;padding:6px 14px;border-radius:20px;background:rgba(12,12,14,.72);border:1px solid rgba(255,255,255,.1)}
.balance-info{display:flex;flex-direction:column;align-items:stretch}
.balance-info small{align-self:flex-start;color:#9d9da6;font-size:8px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.balance span{color:#fff;font-size:15px;font-weight:900;white-space:nowrap;text-align:center;width:100%;font-variant-numeric:tabular-nums}
.win-popup{--win-popup-top:72px;position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + var(--win-popup-top));left:50%;z-index:1000000;display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px);padding:4px 12px 7px 6px;box-sizing:border-box;border-radius:999px;overflow:hidden;background:linear-gradient(180deg,#151515 0%,#0b0b0b 100%);border:1px solid rgba(61,255,154,.55);box-shadow:0 0 10px rgba(61,255,154,.18),0 4px 12px rgba(0,0,0,.5);color:#fff;pointer-events:none;user-select:none;opacity:0;transform:translate(-50%,-18px) scale(.96);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.9,.3,1.2);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.win-popup.show{opacity:1;transform:translate(-50%,0) scale(1)}

.win-popup.amber{border-color:rgba(255,184,40,.6);box-shadow:0 0 10px rgba(255,184,40,.18),0 4px 12px rgba(0,0,0,.5)}
.win-popup-icon{flex:0 0 auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.win-popup-icon svg,.win-popup-icon canvas{width:100%!important;height:100%!important}
.win-popup-text{font-size:12px;font-weight:800;letter-spacing:.1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.win-popup-bar{position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.win-popup-bar i{display:block;height:100%;width:100%;border-radius:2px;background:#3dff9a;transform-origin:left center}
.win-popup.err .win-popup-bar i{background:#ff4d4d}.win-popup.amber .win-popup-bar i{background:#ffb828}
@keyframes winPopupBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

const SHOW_MS=4000,pc={};let proot,picon,ptext,pbar,phide,panim=null,ptok=0,plast=-1;
async function gunzip(buf){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(s).text()}
function ldSticker(src){if(!pc[src])pc[src]=fetch(src).then(r=>r.arrayBuffer()).then(buf=>{const u=new Uint8Array(buf);return u[0]===31&&u[1]===139?gunzip(buf):new TextDecoder().decode(u)}).then(JSON.parse).catch(e=>{delete pc[src];throw e});return pc[src]}
const killAnim=()=>{if(panim){try{panim.destroy()}catch(e){}panim=null}};
function pop(text,kind,sticker,ms){if(!proot){proot=document.createElement('div');proot.className='win-popup';
  proot.innerHTML='<div class="win-popup-icon"></div><div class="win-popup-text"></div><div class="win-popup-bar"><i></i></div>';document.body.appendChild(proot);
  picon=proot.querySelector('.win-popup-icon');ptext=proot.querySelector('.win-popup-text');pbar=proot.querySelector('.win-popup-bar i')}
 ms=ms||(sticker?SHOW_MS:2800);ptext.textContent=text;clearTimeout(phide);proot.className='win-popup '+kind;
 pbar.style.animation='none';void proot.offsetWidth;pbar.style.animation='winPopupBar '+ms+'ms linear forwards';proot.classList.add('show');
 const tok=++ptok;killAnim();picon.textContent=kind==='err'?'⚠️':kind==='amber'?'🪙':'🎉';
 if(sticker&&typeof lottie!=='undefined'){let i;do{i=Math.random()*STK.length|0}while(i===plast&&STK.length>1);plast=i;
  ldSticker(STK[i]).then(d=>{if(tok!==ptok)return;killAnim();picon.textContent='';panim=lottie.loadAnimation({container:picon,renderer:'canvas',loop:true,autoplay:true,animationData:JSON.parse(JSON.stringify(d)),rendererSettings:{clearCanvas:true,progressiveLoad:false,preserveAspectRatio:'xMidYMid meet'}})}).catch(()=>{})}
 phide=setTimeout(()=>{proot.classList.remove('show');setTimeout(()=>{if(tok===ptok)killAnim()},400)},ms)}
const winPop=(win,mult)=>pop((mult>=1?'Выигрыш +':'Выплата +')+win.toFixed(2).replace('.',',')+'$ (x'+parseFloat(mult.toFixed(2))+')',mult>=1?'win':'amber',mult>=1);
setTimeout(()=>STK.forEach(s=>ldSticker(s).catch(()=>{})),3000);
const fl=document.getElementById('flash');
function flash(a){fl.style.transition='none';fl.style.opacity=a;requestAnimationFrame(()=>{fl.style.transition='opacity .9s';fl.style.opacity=0})}
const tntC=document.createElement('canvas');tntC.width=tntC.height=16;onAtlas.push(()=>{const g=tntC.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,16,16);g.drawImage(atlasImg,TNT_T*16,0,16,16,0,0,16,16);tntT.needsUpdate=true});
const tntT=new THREE.CanvasTexture(tntC);tntT.magFilter=tntT.minFilter=THREE.NearestFilter;tntT.generateMipmaps=false;
function dropBlock(x,c,z){const d=-c-1;if(d<0||d>=D-1||x<0||x>=W||z<0||z>=W)return;B[d*400+z*W+x]=0}
function explodeAt(t){busy=true;dead=false;const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({map:tntT})),
  w=new THREE.Mesh(new THREE.BoxGeometry(1.01,1.01,1.01),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}));
 m.position.set(t.x+.5,t.c+.5,t.z+.5);w.position.copy(m.position);scene.add(m,w);let k=0;
 const iv=setInterval(()=>{k++;w.material.opacity=k%2?.7:0;m.scale.setScalar(1+k*.012);w.scale.copy(m.scale);
  if(k>=8){clearInterval(iv);scene.remove(m,w);
   for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)for(let dz=-2;dz<=2;dz++)if(dx*dx+dy*dy+dz*dz<=5)dropBlock(t.x+dx,t.c+dy,t.z+dz);
   rebuild();burst(t.x,t.c,t.z,'#ff8a1a',22);burst(t.x,t.c,t.z,'#555',16);flash(1);shake=.7;vib('heavy');
   dead=true;document.getElementById('dead').style.display='flex';setTimeout(respawn,2600)}},110)}
function respawn(){if(document.getElementById('dead').style.display!=='flex')return;document.getElementById('dead').style.display='none';spawn();dead=false;busy=false;prog=0}
document.getElementById('resp').onclick=respawn;

const colorOf=id=>ORES[id]?ORES[id][2]:id===GRASS?'#5f9f45':id===DIRT?'#866043':id===STONE?'#7d7d7d':'#464646';
async function breakBlock(t){const ore=ORES[t.id];
 if(!ore){dropBlock(t.x,t.c,t.z);rebuild();burst(t.x,t.c,t.z,colorOf(t.id),10);vib('light');prog=0;return}
 if(API.bal+1e-9<ore[1]){pop('Недостаточно средств · нужно '+ore[1].toFixed(2).replace('.',',')+'$','err');cool=.8;prog=0;shake=.15;vib('light');return}
 busy=true;let r;try{r=await API.dig(ore[0])}catch(e){busy=false;prog=0;cool=.8;const m=String(e.message);
  if(/NO_FUNDS/.test(m)){API.init().then(upd).catch(()=>{});pop('Недостаточно средств','err')}
  else if(/RATE/.test(m))pop('Слишком быстро','err')
  else if(/FORBIDDEN/.test(m))pop('Нет доступа: игра пока закрыта','err')
  else if(/EXPIRED|BAD_|SIGNATURE/.test(m))pop('Сессия устарела, откройте игру заново','err')
  else pop('Ошибка сервера: '+m.slice(0,40),'err');return}
 upd();dropBlock(t.x,t.c,t.z);prog=0;
 if(r.tnt){rebuild();explodeAt(t);return}
 rebuild();burst(t.x,t.c,t.z,colorOf(t.id),12);vib('light');
 if(r.win>0){burst(t.x,t.c,t.z,0,8+Math.min(14,Math.floor(r.mult*2)),true)}
 winPop(r.win,r.mult);busy=false}
