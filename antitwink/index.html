<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="robots" content="noindex, nofollow">
  <title>Проверка аккаунта · WXS GAME</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./verify.js?v=5" defer></script>
</head>
<body>
  <div class="shell">
    <header class="brand"><img src="shield.webp" alt="" width="24" height="24"> <span>WXS <strong>GAME</strong></span></header>
    <main class="panel" aria-labelledby="title">
      <div class="hero" aria-hidden="true"><div class="hero-ring"></div><div class="hero-core"><img id="hero-icon" src="shield.webp" alt="" width="64" height="64"></div></div>
      <section class="copy" aria-live="polite">
        <h1 id="title">Проверка аккаунта</h1>
        <p id="description">Проверяем данные входа, сеть и устройство.</p>
        <div class="signals" id="signals">
          <div><img src="device.webp" alt="" width="24" height="24"><span>Устройство</span></div>
          <div><img src="globe.webp" alt="" width="24" height="24"><span>Сеть</span></div>
        </div>
        <ul id="linked" class="linked" aria-label="Связанные аккаунты" hidden></ul>
        <p class="message" id="message" hidden></p>
      </section>
      <div class="actions">
        <button id="action" class="primary" type="button" disabled><span>Проверяем доступ…</span></button>
      </div>
    </main>
    <footer id="privacy">Совпадение устройства, IP или подсети может закрыть доступ.</footer>
  </div>
</body>
</html>
